# Envoy twin of the gateway (README "Nginx vs Envoy"): TLS + HTTP/2 on 9443,
# the three API routes, round-robin over the order replicas with GET-only
# retries, and auth through auth-service (ext_authz). Not mirrored: the
# response cache, rate limits, JSON error pages, realtime and gRPC routes,
# the static site and the admin host.
static_resources:
  listeners:
  - name: https
    address: { socket_address: { address: 0.0.0.0, port_value: 9443 } }
    filter_chains:
    - transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            alpn_protocols: [h2, http/1.1]
            tls_certificates:
            - certificate_chain: { filename: /etc/envoy/certs/gateway.pem }
              private_key: { filename: /etc/envoy/certs/gateway.key }
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: https
          codec_type: AUTO
          # The path auth checks must be the path routing uses: resolve dot
          # segments (encoded or not) and doubled slashes first, and refuse an
          # encoded slash, as nginx does.
          normalize_path: true
          merge_slashes: true
          path_with_escaped_slashes_action: REJECT_REQUEST
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
          http_filters:
          # Every request is checked unless its route turns the filter off.
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              transport_api_version: V3
              # auth-service down → 503 (like nginx), never let the request through.
              failure_mode_allow: false
              status_on_error: { code: ServiceUnavailable }
              # Only the token goes to auth-service.
              allowed_headers:
                patterns: [{ exact: authorization, ignore_case: true }]
              http_service:
                server_uri: { uri: "http://auth-service:8080", cluster: auth, timeout: 2s }
                # The check goes to /verify/<client path> with the client's method.
                path_prefix: /verify
                authorization_response:
                  # Set (not appended) on the request: a client-sent
                  # X-User-ID is replaced by the verified one.
                  allowed_upstream_headers:
                    patterns:
                    - { exact: x-user-id, ignore_case: true }
                    - { exact: x-user-role, ignore_case: true }
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            virtual_hosts:
            - name: gatekeeper
              domains: ["*"]
              routes:
              - match: { path: /health }
                direct_response: { status: 200, body: { inline_string: "ok\n" } }
                typed_per_filter_config: &no_auth
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              # Products are public: no check, and no identity a client could forge.
              - match: { prefix: /api/products/ }
                route: { cluster: products, prefix_rewrite: / }
                request_headers_to_remove: [x-user-id, x-user-role]
                typed_per_filter_config: *no_auth
              - match: { prefix: /api/users/ }
                route: { cluster: users, prefix_rewrite: / }
              # Retries only for GET: a POST that reached a replica may have
              # written, so it is never sent twice (as on the nginx gateway).
              - match:
                  prefix: /api/orders/
                  headers: [{ name: ":method", string_match: { exact: GET } }]
                route:
                  cluster: orders
                  prefix_rewrite: /
                  retry_policy: { retry_on: "connect-failure,refused-stream,reset", num_retries: 2 }
              - match: { prefix: /api/orders/ }
                route: { cluster: orders, prefix_rewrite: / }

  clusters:
  - name: auth
    type: STRICT_DNS
    # Docker gives a recreated container a new address; re-resolve often.
    dns_refresh_rate: 1s
    load_assignment:
      cluster_name: auth
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: auth-service, port_value: 8080 } } } }] }]
  - name: users
    type: STRICT_DNS
    # Docker gives a recreated container a new address; re-resolve often.
    dns_refresh_rate: 1s
    load_assignment:
      cluster_name: users
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: user-service, port_value: 8080 } } } }] }]
  - name: products
    type: STRICT_DNS
    # Docker gives a recreated container a new address; re-resolve often.
    dns_refresh_rate: 1s
    load_assignment:
      cluster_name: products
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: product-service, port_value: 8080 } } } }] }]
  - name: orders
    type: STRICT_DNS
    # Docker gives a recreated container a new address; re-resolve often.
    dns_refresh_rate: 1s
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: orders
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: order-service, port_value: 8080 } } }
        - endpoint: { address: { socket_address: { address: order-service-2, port_value: 8080 } } }
        - endpoint: { address: { socket_address: { address: order-service-3, port_value: 8080 } } }
