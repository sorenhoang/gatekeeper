# Main context. Started with `nginx -c /etc/nginx/gatekeeper/nginx.conf`, so
# every nginx command in the container (-t, -s reload) must pass the same -c.
user nginx;
worker_processes auto;
# After a reload, old workers keep serving their open connections (a
# WebSocket can live for hours); past this they close them and exit.
worker_shutdown_timeout 30s;

# The image links both log files to the container's stderr/stdout.
error_log /var/log/nginx/error.log notice;
pid       /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The request id: a client's own id is kept only if it can't forge fields
    # in the services' space-separated key=value logs (no spaces, no `=`) and
    # is at most 64 chars; anything else (two headers arrive joined by ", ")
    # gets nginx's 32-hex $request_id.
    map $http_x_request_id $req_id {
        "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
        default                   $request_id;
    }

    # Rate limiting (README "Rate limiting"). Exempt: loopback and Docker's
    # compose networks, read from the TCP peer — never from a header, which
    # Phase 2 already refuses to trust. An empty key is never counted.
    geo $limit_exempt {
        default       0;
        127.0.0.0/8   1;
        172.16.0.0/12 1;
    }
    map $limit_exempt $login_limit_key {
        1       "";
        default $binary_remote_addr;
    }
    # Login: 5 requests/s per client; with burst=10 nodelay a spike gets 11
    # answers at once and 429 for the rest.
    limit_req_zone $login_limit_key zone=login:10m rate=5r/s;

    # Global API budget: one bucket per known API key, otherwise per client IP.
    # Only keys listed here count: an invented key maps to "" and the request
    # falls back to the IP bucket, so rotating random keys buys nothing (and
    # can't fill the zone). Lab keys only; Phase 8 replaces this with auth.
    map $http_x_api_key $known_api_key {
        lab-key-alpha lab-key-alpha;
        lab-key-beta  lab-key-beta;
        default       "";
    }
    map "$limit_exempt:$known_api_key" $api_limit_key {
        "~^1:"  "";
        "~^0:$" $binary_remote_addr;
        default $known_api_key;
    }
    # 50 r/s with burst=100 nodelay: sized from the measured smoke suite,
    # whose largest spike is 40–60 requests at once.
    limit_req_zone $api_limit_key zone=api:10m rate=50r/s;
    limit_req_status 429;

    # Realtime connections per client (README "Realtime & gRPC"): limit_req
    # counts requests, but one WebSocket or SSE stream is one request that
    # stays open. Same key as the login zone: client IP, compose exempt.
    limit_conn_zone $login_limit_key zone=streams:10m;
    limit_conn_status 429;
    limit_conn_log_level warn;
    # Both limits answer 429 through one JSON page; say which one it was.
    map $limit_req_status $too_many {
        REJECTED "too many requests";
        default  "too many connections";
    }

    # WebSocket: pass the client's Upgrade on and say "Connection: upgrade";
    # every other request keeps the empty Connection that upstream keepalive
    # needs (Phase 3).
    # Only the WebSocket location sets $ws_route, so no other route can be
    # turned into a tunnel by a client-sent Upgrade.
    map "$ws_route:$http_upgrade" $connection_upgrade {
        "~*^1:websocket$" upgrade;
        default           "";
    }
    map "$ws_route:$http_upgrade" $upgrade_header {
        "~*^1:websocket$" websocket;
        default           "";
    }

    # Browsers can't put a token in a WebSocket or EventSource header, so the
    # realtime routes accept ?access_token=. The token is captured before auth
    # ($realtime_bearer, set in those locations), used as Authorization for
    # the auth subrequest only, and removed from the query sent on.
    map $arg_access_token $realtime_bearer {
        ""      "";
        default "Bearer $arg_access_token";
    }
    map $http_authorization $auth_header {
        ""      $rt_bearer;
        default $http_authorization;
    }
    map $args $args_without_token {
        "~*^access_token=[^&]*&?(?<rest>.*)$"          $rest;
        "~*^(?<pre>.*)&access_token=[^&]*(?<post>.*)$" "$pre$post";
        default                                       $args;
    }
    # Two access_token params (any case), or a percent-encoded name: refused
    # with 400 before auth, so no second token can ride past the strip.
    map $args $args_token_ambiguous {
        "~*access%5ftoken"                       1;
        "~*(^|&)access_token=.*&access_token="   1;
        default                                  "";
    }

    # The log's request field: what the client asked for, without the query
    # (tokens may travel in it). $request_uri, unlike $uri, survives internal
    # redirects such as the SPA fallback to /index.html.
    map $request_uri $request_path {
        "~^(?<path>[^?]*)" $path;
        default            $request_uri;
    }
    # The access log already records each rejection (limit_req field); at the
    # default `error` level a flood would also write one error line per request.
    limit_req_log_level warn;

    # Gateway cache for products (snippets/cache-products.conf). 100m is
    # plenty for echo bodies; an entry unused for 10m is dropped.
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                     max_size=100m inactive=10m use_temp_path=off;
    # Verdicts of the auth subrequest (/_auth in default.conf), kept 10s so a
    # burst of calls with one token costs one /verify. The key holds the
    # token, so the files under /var/cache/nginx/auth are secrets too.
    proxy_cache_path /var/cache/nginx/auth levels=1:2 keys_zone=auth_cache:1m
                     max_size=10m inactive=1m use_temp_path=off;

    # CORS (snippets/response-headers.conf, snippets/cors-preflight.conf).
    # Only these origins may call the API from a browser; any other gets no
    # CORS headers, so its browser blocks the answer. An empty value makes
    # add_header send nothing.
    map $http_origin $cors_origin {
        default                      "";
        "https://app.localhost:8443" $http_origin;
        "http://localhost:5173"      $http_origin;
    }
    # A preflight is an OPTIONS from an allowed origin naming the method it
    # wants to send. The method comes before the origin and may not contain a
    # colon: origins do ("https://…:8443"), so `.+:.+` would let a plain
    # OPTIONS with no Access-Control-Request-Method match too.
    map "$request_method:$http_access_control_request_method:$cors_origin" $cors_preflight {
        default             "";
        "~^OPTIONS:[^:]+:." 1;
    }
    # The API's methods (RPC style: no PUT/PATCH).
    map $cors_preflight $cors_allow_methods { 1 "GET, POST, DELETE, OPTIONS"; default ""; }
    map $cors_preflight $cors_allow_headers { 1 "Authorization, Content-Type, X-Request-ID"; default ""; }
    map $cors_preflight $cors_max_age       { 1 600; default ""; }
    map $cors_origin $cors_expose           { "" ""; default "X-Request-ID"; }

    # Headers that carry credentials. An allowlist: a backend that reads some
    # other auth header (X-Auth-Token, …) needs it added here too.
    map "$http_authorization$http_proxy_authorization$http_cookie$http_x_api_key" $cache_skip {
        ""      "";
        default 1;
    }

    # One JSON object per request. escape=json makes any value safe to embed;
    # every field is a string (after a retry, upstream_* are lists such as
    # "172.19.0.6:8080, 127.0.0.1:8081"). Fields nginx doesn't use for a request
    # (upstream_* when it answered itself) log as "".
    #   request_time            first client byte → last byte sent: everything
    #   upstream_response_time  time spent waiting on the backend(s)
    # The gap between them is client I/O (slow upload or download) plus nginx's
    # own work, not the service.
    log_format gatekeeper escape=json
        '{"time":"$time_iso8601","request_id":"$req_id","remote_addr":"$remote_addr",'
        '"host":"$host","request":"$request_method $request_path $server_protocol","status":"$status","bytes":"$body_bytes_sent",'
        '"request_time":"$request_time","route":"$route","upstream":"$proxy_host",'
        '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent","limit_req":"$limit_req_status","cache":"$upstream_cache_status"}';

    # The gateway's own /health is polled constantly and tells nothing.
    map $uri $loggable {
        /health 0;
        default 1;
    }

    access_log /var/log/nginx/access.log gatekeeper if=$loggable;
    sendfile          on;
    open_file_cache max=1000 inactive=30s;
    # ^ Docker Desktop bind mounts make every open()/stat() of a static file
    # slow: caching the descriptors took /, /assets/app.css from 20.6k to
    # 123k req/s (README "Performance & zero-downtime"). An edited file shows
    # up within open_file_cache_valid (60s); missing files aren't cached.
    keepalive_timeout 65;

    # text/html is always compressed once gzip is on (still subject to the
    # 256-byte minimum: below it gzip would make the body bigger). Vary tells
    # caches to keep both forms apart.
    gzip            on;
    gzip_types      application/json text/css application/javascript;
    gzip_min_length 256;
    gzip_vary       on;

    # Docker's embedded DNS. Upstreams marked `resolve` re-query it every
    # `valid`, so recreated services (new or swapped IPs) are followed without
    # a reload, and a missing service does not stop nginx from starting.
    # Until `valid` expires a swapped IP is still routed to the old address,
    # so keep it short.
    resolver 127.0.0.11 valid=2s ipv6=off;

    # For every server, including ones added later: inside the compose
    # network a connect either succeeds at once or the address is dead.
    proxy_connect_timeout 1s;
    proxy_send_timeout    5s;

    # nginx's defaults, written down so the README's numbers are backed by
    # config: bodies over 1m get 413 before any backend is contacted, bodies
    # over 16k are written to a temp file first. Phase 5 tunes these.
    client_max_body_size    1m;
    client_body_buffer_size 16k;

    # Slowloris-style clients hold a connection open by sending a request a few
    # bytes at a time. Defaults are 60s; a client that stops sending its
    # headers is now cut off after 5s (no response), a stalled body after 10s.
    client_header_timeout 5s;
    client_body_timeout   10s;

    include /etc/nginx/gatekeeper/conf.d/*.conf;
}
