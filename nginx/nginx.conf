# Main context. Started with `nginx -c /etc/nginx/gatekeeper/nginx.conf`, so
# every nginx command in the container (-t, -s reload) must pass the same -c.
user nginx;
worker_processes auto;

# The image links both log files to the container's stderr/stdout.
error_log /var/log/nginx/error.log notice;
pid       /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log        /var/log/nginx/access.log combined;
    sendfile          on;
    keepalive_timeout 65;

    # Docker's embedded DNS. Upstreams marked `resolve` re-query it every
    # `valid`, so recreated services (new or swapped IPs) are followed without
    # a reload, and a missing service does not stop nginx from starting.
    # Until `valid` expires a swapped IP is still routed to the old address,
    # so keep it short.
    resolver 127.0.0.11 valid=2s ipv6=off;

    # For every server, including ones added later: inside the compose
    # network a connect either succeeds at once or the address is dead.
    proxy_connect_timeout 1s;
    proxy_send_timeout    5s;

    # nginx's defaults, written down so the README's numbers are backed by
    # config: bodies over 1m get 413 before any backend is contacted, bodies
    # over 16k are written to a temp file first. Phase 5 tunes these.
    client_max_body_size    1m;
    client_body_buffer_size 16k;

    include /etc/nginx/gatekeeper/conf.d/*.conf;
}
