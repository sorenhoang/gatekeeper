# Retry a failed request on the next server of the upstream. Included by
# locations whose upstream has more than one server (orders), and by the smoke
# tests' temporary servers so they exercise exactly these rules.
#
# - error / timeout: the connect failed, or the server went silent.
# - http_502 / http_503: the server itself answered "bad gateway / unavailable".
# - A request that was already sent is never retried if its method is not
#   idempotent (POST, PATCH, ...): nginx's default, kept. A failed *connect*
#   sent nothing, so even a POST may move on then.
proxy_next_upstream error timeout http_502 http_503;
# One retry: with 15s read timeouts, more tries would mostly add waiting.
proxy_next_upstream_tries 2;
# Total time for all tries, so a retry can't double orders' 15s budget.
# Because it equals orders' 15s read timeout, a GET that times out reading is
# never retried on orders; only fast failures (connect, 502, 503) are.
proxy_next_upstream_timeout 15s;
