# The auth check itself (README "Auth & CORS"): nginx asks /_auth
# (auth-service /verify) before proxying; only a 2xx lets the request
# through. The error pages are separate (auth.conf: JSON, grpc-errors.conf:
# gRPC statuses), because each kind of client needs its own.
auth_request /_auth;
# The verified identity, sent on by proxy-headers.conf or grpc-headers.conf,
# which overwrite whatever the client sent in these headers. $sent_http_*
# (the subrequest's answer) works for both checks; $upstream_http_* would be
# empty for /_auth_njs, which has no upstream.
auth_request_set $auth_user $sent_http_x_user_id;
auth_request_set $auth_role $sent_http_x_user_role;
