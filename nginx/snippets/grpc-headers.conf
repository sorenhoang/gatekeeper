# What a gRPC backend receives (the grpc_pass counterpart of
# proxy-headers.conf); arrives as metadata, e.g. x-user-id. Set, never
# passed through: a client-sent x-user-id is replaced, or dropped when empty.
grpc_set_header X-User-ID         $auth_user;
grpc_set_header X-User-Role       $auth_role;
grpc_set_header X-Request-ID      $req_id;
grpc_set_header X-Forwarded-For   $remote_addr;
grpc_set_header X-Real-IP         $remote_addr;
grpc_set_header X-Forwarded-Proto $scheme;
