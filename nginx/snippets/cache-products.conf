# Shared cache rules (README "Caching"). Included by the products location,
# which sets its own TTL (proxy_cache_valid), and by the smoke tests'
# temporary servers, so the break-its exercise exactly these rules.
proxy_cache api_cache;
# The client's Host is part of the key: the default server accepts any host
# and product-service echoes it, so without $host one request with
# `Host: evil.example` would store a body every other client then gets.
proxy_cache_key $scheme$host$request_uri;

# A credential means the answer may be personal: never answer such a request
# from the shared cache, and never store its answer. $cache_skip is non-empty
# when Authorization, Cookie or X-API-Key is present (nginx.conf).
proxy_cache_bypass $cache_skip;
proxy_no_cache     $cache_skip;

# Stampede protection: on a cold key one request goes to the service, the
# others wait for its answer (up to products' 5s read timeout, then they go
# to the service themselves, so a hung service still gets a stampede, ~10s
# worst case for a waiter). Waiters re-check about every 500ms.
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;

# When the service fails, answer from an expired entry instead of failing;
# when an entry expires, answer it stale once and refresh it in the background.
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;

# MISS, HIT, EXPIRED, STALE, UPDATING, BYPASS — empty when not cached at all.
add_header X-Cache-Status $upstream_cache_status always;
