# gRPC clients read the status from grpc-status, not from the HTTP code or a
# body: an HTML or JSON 502 only makes them report "malformed header". So
# every error nginx produces for a gRPC route becomes gRPC's error-only answer:
# HTTP 200, content-type application/grpc, grpc-status + grpc-message (the
# `=` keeps the named location's 200). A 204 doesn't work: it carries no
# content-type, which clients reject (measured in the Phase 9 probe).
error_page 401 = @grpc_unauthenticated;
error_page 403 = @grpc_permission_denied;
error_page 429 = @grpc_resource_exhausted;
# Bodies over client_max_body_size (1m) and malformed requests.
error_page 413 = @grpc_too_large;
error_page 400 = @grpc_invalid_argument;
error_page 500 502 503 504 = @grpc_unavailable;
