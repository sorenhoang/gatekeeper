# Included in every proxied location, and the only place proxy_set_header
# appears: one proxy_set_header in a location drops all inherited ones, so a
# server-level set would silently vanish the first time a route adds its own.

# The client's host, not the upstream's name (`users`).
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Proto $scheme;

# The gateway is the first hop, so anything a client sent here is untrusted:
# overwrite with the TCP peer instead of appending to it
# ($proxy_add_x_forwarded_for would keep a forged left-most entry).
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header Forwarded         "";

# The request id the gateway logs and returns; a backend may not add its own,
# or the client would get two.
proxy_set_header X-Request-ID      $req_id;
proxy_hide_header X-Request-ID;

# HTTP/1.0 (nginx's default to upstreams) sends Connection: close; 1.1 with an
# empty Connection lets Phase 3's upstream keepalive pool reuse connections.
proxy_http_version 1.1;
proxy_set_header Connection        $connection_upgrade;
# Only the /ws/ location passes Upgrade on (nginx.conf $ws_route); empty means not sent.
proxy_set_header Upgrade           $upgrade_header;

# Identity comes only from the gateway: $auth_* are set by auth_request_set in
# protected locations (snippets/auth.conf) and empty elsewhere; an empty value
# drops the header, so a client-sent X-User-ID never reaches a service.
proxy_set_header X-User-ID         $auth_user;
proxy_set_header X-User-Role       $auth_role;
