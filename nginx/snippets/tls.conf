# TLS for every 443 server (README "TLS & HTTP/2"). The files come from
# `make certs` (certs/, mounted read-only at /etc/nginx/certs).
ssl_certificate     /etc/nginx/certs/gateway.pem;
ssl_certificate_key /etc/nginx/certs/gateway.key;

# TLS 1.0/1.1 are refused at the handshake. TLS 1.3 picks its own ciphers;
# for 1.2: the RSA-key suites of Mozilla's "intermediate" profile (forward
# secrecy, AEAD). The ECDSA ones would be dead weight with an RSA leaf.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

# Resumption from a server-side cache (~4000 sessions per MB). Tickets stay
# off: their key would live in each worker's memory and never rotate here.
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
