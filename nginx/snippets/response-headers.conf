# Included in every location that sets its own add_header (all of them):
# one add_header in a location drops every inherited one, so a server- or
# http-level X-Request-ID would silently vanish. $req_id is defined in
# nginx.conf (a well-formed client id, or nginx's $request_id).
add_header X-Request-ID $req_id always;

# HSTS: browsers that saw this over HTTPS use HTTPS for the host from then on.
# Only HTTPS servers include this file (over HTTP the header is ignored).
# max-age is 5 minutes on purpose: a long one would pin localhost to HTTPS in
# your browser for every other local project. No includeSubDomains.
add_header Strict-Transport-Security "max-age=300" always;

# CORS for allowed origins (maps in nginx.conf); every value is empty for any
# other origin, and add_header sends nothing then. Here, not per location, so
# the JSON error pages carry them too: without them a browser hides the real
# 401/403/429/502 from the app. Tokens travel in Authorization, not cookies,
# so no Access-Control-Allow-Credentials.
add_header Access-Control-Allow-Origin   $cors_origin always;
add_header Access-Control-Expose-Headers $cors_expose always;
add_header Access-Control-Allow-Methods  $cors_allow_methods always;
add_header Access-Control-Allow-Headers  $cors_allow_headers always;
add_header Access-Control-Max-Age        $cors_max_age always;
# The answer depends on Origin, so caches must keep the variants apart.
add_header Vary Origin always;
