# The auth subrequest's request to auth-service /verify (default.conf /_auth).
# Always a body-less GET, whatever the client sent; the client's method and
# URI travel as headers for auth-service's role rules.
proxy_method GET;
proxy_pass_request_body off;
proxy_set_header Content-Length    "";
proxy_set_header X-Original-Method $request_method;
proxy_set_header X-Original-URI    $request_uri;
