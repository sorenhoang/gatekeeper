# The auth subrequest's request to auth-service /verify (default.conf /_auth).
# Always a body-less GET, whatever the client sent; the client's method and
# URI travel as headers for auth-service's role rules.
proxy_method GET;
proxy_pass_request_body off;
proxy_set_header Content-Length    "";
proxy_set_header X-Original-Method $request_method;
# The client's Authorization, or on the realtime routes the ?access_token=
# captured before this subrequest ran (nginx.conf $auth_header).
proxy_set_header Authorization     $auth_header;
