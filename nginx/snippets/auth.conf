# Auth for a protected location (README "Auth & CORS"). nginx asks /_auth
# (auth-service /verify) before proxying; only a 2xx lets the request through.
auth_request /_auth;
# The verified identity, sent on by proxy-headers.conf, which overwrites
# whatever the client sent in these headers.
auth_request_set $auth_user $upstream_http_x_user_id;
auth_request_set $auth_role $upstream_http_x_user_role;

# A location that declares any error_page inherits none from the server, so
# the gateway's other JSON pages are repeated here.
error_page 401 @unauthorized;
error_page 403 @forbidden;
# An unreachable or failing auth-service makes auth_request answer 500: fail
# closed with a 503, never let the request through. The `=` takes the named
# location's status (503); without it the client would still see 500.
error_page 500 = @auth_unavailable;
error_page 502 @bad_gateway;
error_page 503 @unavailable;
error_page 504 @gateway_timeout;
error_page 429 @too_many_requests;
