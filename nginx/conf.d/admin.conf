# Picked when the Host header is admin.localhost (Chrome resolves *.localhost
# to loopback, so http://admin.localhost:8080 works). Its files live outside
# the main root, so localhost:8080/admin/ can never serve them; Phase 8 adds
# auth_basic here. No SPA fallback and no API routes on this host.
server {
    listen 443 ssl;
    http2 on;
    include /etc/nginx/gatekeeper/snippets/tls.conf;
    server_name admin.localhost;

    # Logged as "route" in the access log (nginx.conf).
    set $route admin;

    root /usr/share/nginx/admin;

    location / {
        # Basic login (htpasswd from `make secrets`). Checked in the access
        # phase, so this location must not answer with `return`, which runs
        # earlier and would skip the check.
        auth_basic "gatekeeper admin";
        auth_basic_user_file /etc/nginx/secrets/admin.htpasswd;
        add_header X-Route admin always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        try_files $uri $uri/ =404;
    }
}
