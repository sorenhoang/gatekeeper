# One upstream per API service. `resolve` needs a shared-memory `zone` to keep
# the addresses it re-resolves; Phase 3 adds replicas and keepalive here.
upstream users {
    zone users 64k;
    server user-service:8080 resolve;
}

upstream orders {
    zone orders 64k;
    server order-service:8080 resolve;
}

upstream products {
    zone products 64k;
    server product-service:8080 resolve;
}
