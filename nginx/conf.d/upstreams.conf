# One upstream per API service. `resolve` needs a shared-memory `zone` to keep
# the addresses it re-resolves (and, for orders, the shared least_conn and
# failure counters across workers). keepalive 32 keeps up to 32 idle
# connections per worker to each upstream; it only works because the proxy
# snippet speaks HTTP/1.1 with an empty Connection header.
upstream users {
    zone users 64k;
    server user-service:8080 resolve;
    keepalive 32;
}

# Orders may be slow (15s read timeout), so pick the replica with the fewest
# active requests: round-robin would keep feeding a stuck one its share.
# max_fails/fail_timeout are nginx's defaults, written down: one failure takes
# a replica out for 10s.
upstream orders {
    zone orders 64k;
    least_conn;
    server order-service:8080   resolve max_fails=1 fail_timeout=10s;
    server order-service-2:8080 resolve max_fails=1 fail_timeout=10s;
    server order-service-3:8080 resolve max_fails=1 fail_timeout=10s;
    # Only when all three are out: a degraded 200 instead of a 502
    # (orders-fallback.conf).
    server 127.0.0.1:8081 backup;
    keepalive 32;
}

upstream products {
    zone products 64k;
    server product-service:8080 resolve;
    keepalive 32;
}
