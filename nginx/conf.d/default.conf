# $uri is decoded, so a `"` or `\` in it would break the JSON 404 body;
# echo only paths made of characters that need no JSON escaping.
map $uri $json_safe_uri {
    "~^[A-Za-z0-9/._~@:+,;=!$&'()*-]*$"  $uri;
    default                              "(not shown)";
}

# Catch-all virtual server: the frontend and the API routes.
# Every location sets X-Route, so `curl -I` shows which one won.
server {
    listen 443 ssl default_server;
    http2 on;
    include /etc/nginx/gatekeeper/snippets/tls.conf;
    server_name _;

    root /usr/share/nginx/html;

    # Redirects (e.g. /api/users → /api/users/) keep the client's host:port;
    # an absolute one would point at port 80 inside the container.
    absolute_redirect off;

    # Read timeouts are per route below (connect/send are set for every server
    # in nginx.conf): each is the longest *silence* allowed between two reads
    # from the backend, not a total deadline. The default 60s would hold a
    # client for a minute on a hung backend.

    # Errors nginx itself generates (no address, refused, timed out) answer as
    # JSON naming the route. proxy_intercept_errors stays off, so a backend's
    # own 500/502/503 passes through as the backend wrote it.
    # $route is set per location. No server-level `set $route ""`: the auth
    # subrequest runs the server's rewrites too and would wipe the route its
    # parent set (empty 401 pages and access-log route fields).
    error_page 502 @bad_gateway;
    error_page 503 @unavailable;
    error_page 504 @gateway_timeout;
    error_page 429 @too_many_requests;

    # Login (auth-service POST /login): exact matches with the strict login
    # limit. Both spellings share one bucket, so the trailing slash is no way
    # around it. No auth_request here: this is where tokens come from.
    location = /api/auth/login {
        set $route login;
        limit_req zone=login burst=10 nodelay;
        add_header X-Route login always;
        include /etc/nginx/gatekeeper/snippets/cors-preflight.conf;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        include /etc/nginx/gatekeeper/snippets/proxy-headers.conf;
        proxy_read_timeout 2s;
        proxy_pass http://auth/login;
    }

    location = /api/auth/login/ {
        set $route login;
        limit_req zone=login burst=10 nodelay;
        add_header X-Route login always;
        include /etc/nginx/gatekeeper/snippets/cors-preflight.conf;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        include /etc/nginx/gatekeeper/snippets/proxy-headers.conf;
        proxy_read_timeout 2s;
        proxy_pass http://auth/login;
    }

    # The Phase 5 login paths moved; 308 keeps the method and body. The new
    # path applies the limit, so the redirect itself needs none.
    location = /api/users/login {
        set $route login;
        add_header X-Route login always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        return 308 /api/auth/login;
    }

    location = /api/users/login/ {
        set $route login;
        add_header X-Route login always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        return 308 /api/auth/login;
    }

    # The auth subrequest: never reachable from outside (internal). It sends
    # the client's headers (Authorization) but no body, always as GET, and
    # tells auth-service the original method for its role rules.
    location = /_auth {
        internal;
        proxy_pass http://auth/verify;
        include /etc/nginx/gatekeeper/snippets/proxy-headers.conf;
        include /etc/nginx/gatekeeper/snippets/auth-subrequest.conf;
        proxy_read_timeout 2s;
        # Only "allowed" is cached (10s): a 401/403 is re-asked every time. The
        # method is in the key because the answer depends on it. ponytail: a
        # token is accepted up to 10s past its exp; key per URI if rules grow.
        proxy_cache auth_cache;
        proxy_cache_key "$auth_header:$request_method";
        proxy_cache_valid 204 10s;
        proxy_cache_methods GET HEAD;
    }

    # The same check in njs (nginx/njs/auth.js), without a request to
    # auth-service; used when auth-check.conf points auth_request here. An
    # exact, internal location: auth_request treats any 2xx as allowed, and a
    # name that matched nothing would fall through to the site (a 200).
    location = /_auth_njs {
        internal;
        js_content auth.verify;
    }

    # The trailing slash in proxy_pass replaces the matched prefix:
    # /api/users/42 reaches user-service as /42.
    # ^~ stops the regex search: without it the asset regex below would win
    # for /api/products/logo.png, because regexes beat plain prefixes.
    location ^~ /api/users/ {
        set $route users;
        limit_req zone=api burst=100 nodelay;
        add_header X-Route users always;
        include /etc/nginx/gatekeeper/snippets/cors-preflight.conf;
        include /etc/nginx/gatekeeper/snippets/auth.conf;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        include /etc/nginx/gatekeeper/snippets/proxy-headers.conf;
        proxy_read_timeout 2s;  # users must be fast
        proxy_pass http://users/;
    }

    location ^~ /api/orders/ {
        set $route orders;
        limit_req zone=api burst=100 nodelay;
        add_header X-Route orders always;
        include /etc/nginx/gatekeeper/snippets/cors-preflight.conf;
        include /etc/nginx/gatekeeper/snippets/auth.conf;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        include /etc/nginx/gatekeeper/snippets/proxy-headers.conf;
        include /etc/nginx/gatekeeper/snippets/upstream-retry.conf;
        proxy_read_timeout 15s;  # orders may be slow
        proxy_pass http://orders/;
    }

    location ^~ /api/products/ {
        set $route products;
        limit_req zone=api burst=100 nodelay;
        add_header X-Route products always;
        include /etc/nginx/gatekeeper/snippets/cors-preflight.conf;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        include /etc/nginx/gatekeeper/snippets/proxy-headers.conf;
        include /etc/nginx/gatekeeper/snippets/cache-products.conf;
        proxy_cache_valid 200 30s;
        proxy_read_timeout 5s;
        proxy_pass http://products/;
    }

    # Realtime (README "Realtime & gRPC"): long-lived, so the read timeout is
    # an hour and the service's heartbeats keep the line from going silent.
    # Each open stream is one connection under limit_conn streams.
    location ^~ /ws/ {
        set $route ws;
        set $rt_bearer $realtime_bearer;
        set $ws_route 1;
        # Error-log lines print the raw request line, query and token
        # included; on these routes only crit (nothing they produce) is
        # logged. The access log still records every status.
        error_log /var/log/nginx/error.log crit;
        if ($args_token_ambiguous) {
            return 400;
        }
        limit_req zone=api burst=100 nodelay;
        limit_conn streams 10;
        add_header X-Route ws always;
        include /etc/nginx/gatekeeper/snippets/auth.conf;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        include /etc/nginx/gatekeeper/snippets/proxy-headers.conf;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://realtime/ws$is_args$args_without_token;
    }

    # SSE: no buffering, so an event leaves nginx as soon as it arrives even
    # for a slow client; never cached.
    location ^~ /api/events/ {
        set $route events;
        set $rt_bearer $realtime_bearer;
        # Error-log lines print the raw request line, query and token
        # included; on these routes only crit (nothing they produce) is
        # logged. The access log still records every status.
        error_log /var/log/nginx/error.log crit;
        if ($args_token_ambiguous) {
            return 400;
        }
        limit_req zone=api burst=100 nodelay;
        limit_conn streams 10;
        add_header X-Route events always;
        include /etc/nginx/gatekeeper/snippets/cors-preflight.conf;
        include /etc/nginx/gatekeeper/snippets/auth.conf;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        include /etc/nginx/gatekeeper/snippets/proxy-headers.conf;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_pass http://realtime/events$is_args$args_without_token;
    }

    # gRPC (README "Realtime & gRPC"): HTTP/2 from the client over TLS,
    # h2c (HTTP/2 without TLS) to realtime-service:9090. A regex so both
    # services share one location; gRPC paths are /package.Service/Method.
    # Each RPC is one request: the API rate limit counts it.
    location ~ ^/(gatekeeper\.Echo|grpc\.health\.v1\.Health)/ {
        set $route grpc;
        # gRPC is always POST; anything else isn't a gRPC client.
        if ($request_method != POST) {
            return 405;
        }
        limit_req zone=api burst=100 nodelay;
        add_header X-Route grpc always;
        include /etc/nginx/gatekeeper/snippets/auth-check.conf;
        include /etc/nginx/gatekeeper/snippets/grpc-errors.conf;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        include /etc/nginx/gatekeeper/snippets/grpc-headers.conf;
        grpc_connect_timeout 1s;
        grpc_read_timeout 15s;
        grpc_pass grpc://realtime_grpc;
    }

    location @grpc_unauthenticated {
        default_type application/grpc;
        add_header X-Route $route always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        add_header grpc-status 16 always;
        add_header grpc-message "unauthenticated" always;
        return 200 "";
    }

    location @grpc_permission_denied {
        default_type application/grpc;
        add_header X-Route $route always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        add_header grpc-status 7 always;
        add_header grpc-message "permission denied" always;
        return 200 "";
    }

    location @grpc_resource_exhausted {
        default_type application/grpc;
        add_header X-Route $route always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        add_header grpc-status 8 always;
        add_header grpc-message "$too_many" always;
        return 200 "";
    }

    location @grpc_too_large {
        default_type application/grpc;
        add_header X-Route $route always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        add_header grpc-status 8 always;
        add_header grpc-message "request too large" always;
        return 200 "";
    }

    location @grpc_invalid_argument {
        default_type application/grpc;
        add_header X-Route $route always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        add_header grpc-status 3 always;
        add_header grpc-message "invalid request" always;
        return 200 "";
    }

    location @grpc_unavailable {
        default_type application/grpc;
        add_header X-Route $route always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        add_header grpc-status 14 always;
        add_header grpc-message "unavailable" always;
        return 200 "";
    }

    # error_page is an internal redirect: the API location's add_header does
    # not apply here, so X-Route is set again from the $route it left behind.
    location @bad_gateway {
        default_type application/json;
        add_header X-Route $route always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        return 502 '{"error":"bad gateway","status":502,"route":"$route"}\n';
    }

    location @unavailable {
        default_type application/json;
        add_header X-Route $route always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        return 503 '{"error":"service unavailable","status":503,"route":"$route"}\n';
    }

    # Retry-After: 1 is the smallest whole-second value; login frees a slot
    # every 200ms and the API zone every 20ms.
    location @too_many_requests {
        default_type application/json;
        add_header X-Route $route always;
        add_header Retry-After 1 always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        return 429 '{"error":"$too_many","status":429,"route":"$route"}\n';
    }

    # From auth_request (snippets/auth.conf). The JSON shape matches the other
    # gateway errors; WWW-Authenticate tells a client which scheme to use.
    location @unauthorized {
        default_type application/json;
        add_header X-Route $route always;
        add_header WWW-Authenticate 'Bearer realm="gatekeeper"' always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        return 401 '{"error":"unauthorized","status":401,"route":"$route"}\n';
    }

    location @forbidden {
        default_type application/json;
        add_header X-Route $route always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        return 403 '{"error":"forbidden","status":403,"route":"$route"}\n';
    }

    location @auth_unavailable {
        default_type application/json;
        add_header X-Route $route always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        return 503 '{"error":"auth unavailable","status":503,"route":"$route"}\n';
    }

    location @gateway_timeout {
        default_type application/json;
        add_header X-Route $route always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        return 504 '{"error":"gateway timeout","status":504,"route":"$route"}\n';
    }

    # Any /api/ path no service prefix claimed, e.g. /api/usersX.
    location ^~ /api/ {
        default_type application/json;
        set $route api-404;
        add_header X-Route api-404 always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        return 404 '{"error":"not found","path":"$json_safe_uri"}\n';
    }

    # Exact match: answered by nginx, even when every service is down.
    location = /health {
        default_type application/json;
        set $route health;
        add_header X-Route health always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        return 200 '{"status":"ok","from":"gateway"}\n';
    }

    # Static files that exist are served; a missing one is a 404, never the
    # SPA shell (HTML served as JavaScript breaks the page confusingly).
    location ~* \.(css|js|mjs|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf)$ {
        set $route static;
        add_header X-Route static always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        try_files $uri =404;
    }

    # SPA fallback: any other path gets index.html and the client-side router
    # takes over. no-cache makes browsers revalidate the shell after a deploy.
    location / {
        set $route spa;
        add_header X-Route spa always;
        include /etc/nginx/gatekeeper/snippets/response-headers.conf;
        add_header Cache-Control no-cache always;
        try_files $uri $uri/ /index.html;
    }
}
