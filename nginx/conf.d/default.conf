# $uri is decoded, so a `"` or `\` in it would break the JSON 404 body;
# echo only paths made of characters that need no JSON escaping.
map $uri $json_safe_uri {
    "~^[A-Za-z0-9/._~@:+,;=!$&'()*-]*$"  $uri;
    default                              "(not shown)";
}

# Catch-all virtual server: the frontend and the API routes.
# Every location sets X-Route, so `curl -I` shows which one won.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;

    # Redirects (e.g. /api/users → /api/users/) keep the client's host:port;
    # an absolute one would point at port 80 inside the container.
    absolute_redirect off;

    # The trailing slash in proxy_pass replaces the matched prefix:
    # /api/users/42 reaches user-service as /42.
    # ^~ stops the regex search: without it the asset regex below would win
    # for /api/products/logo.png, because regexes beat plain prefixes.
    location ^~ /api/users/ {
        add_header X-Route users always;
        proxy_pass http://users/;
    }

    location ^~ /api/orders/ {
        add_header X-Route orders always;
        proxy_pass http://orders/;
    }

    location ^~ /api/products/ {
        add_header X-Route products always;
        proxy_pass http://products/;
    }

    # Any /api/ path no service prefix claimed, e.g. /api/usersX.
    location ^~ /api/ {
        default_type application/json;
        add_header X-Route api-404 always;
        return 404 '{"error":"not found","path":"$json_safe_uri"}\n';
    }

    # Exact match: answered by nginx, even when every service is down.
    location = /health {
        default_type application/json;
        add_header X-Route health always;
        return 200 '{"status":"ok","from":"gateway"}\n';
    }

    # Static files that exist are served; a missing one is a 404, never the
    # SPA shell (HTML served as JavaScript breaks the page confusingly).
    location ~* \.(css|js|mjs|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf)$ {
        add_header X-Route static always;
        try_files $uri =404;
    }

    # SPA fallback: any other path gets index.html and the client-side router
    # takes over. no-cache makes browsers revalidate the shell after a deploy.
    location / {
        add_header X-Route spa always;
        add_header Cache-Control no-cache always;
        try_files $uri $uri/ /index.html;
    }
}
