# Plain HTTP (host :8080) never serves the app since Phase 7: every request
# is sent to the same path on HTTPS. The target names the *host* port 8443;
# $scheme://$host would mean 443, where nothing listens on the host.
# Phase 5's client_header/body timeouts (nginx.conf) apply here as well.
server {
    listen 80 default_server;
    server_name _;
    set $route redirect;

    # Probes and scripts that only speak plain HTTP.
    location = /health {
        default_type application/json;
        set $route health;
        add_header X-Route health always;
        return 200 '{"status":"ok","from":"gateway"}\n';
    }

    # 301 lets a client replay a POST as a GET; 308 keeps method and body.
    location / {
        if ($request_method ~ ^(GET|HEAD)$) {
            return 301 https://$host:8443$request_uri;
        }
        return 308 https://$host:8443$request_uri;
    }
}
