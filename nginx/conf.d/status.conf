# nginx's built-in counters (connections, requests). Loopback inside the
# gateway container only: not published, not reachable from the compose
# network. 8081 is the orders backup. Read with `make status`.
server {
    listen 127.0.0.1:8086;
    access_log off;
    set $route status;

    location = /nginx_status {
        stub_status;
    }
}
