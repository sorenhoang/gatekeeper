# The orders upstream's backup: used only when every order replica is
# unavailable (no address, or ejected by max_fails). Bound to loopback inside
# the gateway container, so nothing outside can reach it, and answered by
# nginx itself: the degraded response needs no extra container.
server {
    listen 127.0.0.1:8081;

    location / {
        default_type application/json;
        add_header X-Degraded true always;
        # Never cached (Phase 6), so it can't be replayed after recovery.
        add_header Cache-Control no-store always;

        # A success answer to a write would read as "order created" while
        # nothing was written: only safe methods get the degraded 200.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 503 '{"degraded":true,"service":"orders-fallback","error":"orders unavailable, nothing was written"}\n';
        }
        return 200 '{"degraded":true,"service":"orders-fallback"}\n';
    }
}
