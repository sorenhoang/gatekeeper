# Only the gateway is published to the host; the services are reachable
# solely over the compose network (Phase 8 relies on that).
# DELAY_MS / FAIL_RATE pass through from the shell when set, e.g.
#   DELAY_MS=5000 docker compose up -d order-service
services:
  gateway:
    image: nginx:1.27-alpine
    # Mount the directory, not single files: editors that replace a file on
    # save leave a single-file bind mount pointing at the old inode.
    command: ["nginx", "-c", "/etc/nginx/gatekeeper/nginx.conf", "-g", "daemon off;"]
    volumes:
      - ./nginx:/etc/nginx/gatekeeper:ro
      - ./frontend:/usr/share/nginx/html:ro
      # Outside the main root on purpose: the main host must never serve it.
      - ./admin:/usr/share/nginx/admin:ro
      # From `make certs`; never committed.
      - ./certs:/etc/nginx/certs:ro
      # Only the gateway's half of `make secrets`: never the signing key.
      - ./secrets/gateway:/etc/nginx/secrets:ro
    ports:
      - "8080:80"
      - "8443:443"
    depends_on: [user-service, order-service, order-service-2, order-service-3, product-service, auth-service, realtime-service]
    restart: "no"
    # A load test writes hundreds of thousands of access-log lines; bounded
    # rotation keeps the container log (and `docker compose logs`) small.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  user-service:
    build: { context: ./services, args: { SERVICE: user-service } }
    environment: [DELAY_MS, FAIL_RATE]
    restart: "no"

  # Three named replicas of the same binary (echo `service` stays
  # order-service; `hostname` tells them apart). Named, not `replicas: 3`, so
  # chaos can target one: DELAY_MS=800 docker compose up -d order-service-2
  order-service: &order-replica
    build: { context: ./services, args: { SERVICE: order-service } }
    environment: [DELAY_MS, FAIL_RATE]
    restart: "no"

  order-service-2: *order-replica

  order-service-3: *order-replica

  product-service:
    build: { context: ./services, args: { SERVICE: product-service } }
    environment: [DELAY_MS, FAIL_RATE]
    restart: "no"

  auth-service:
    build: { context: ./services, args: { SERVICE: auth-service } }
    environment: [DELAY_MS, FAIL_RATE]
    # Signing key and lab users from `make secrets`.
    volumes:
      - ./secrets/auth:/etc/gatekeeper/auth:ro
    restart: "no"

  # WebSocket /ws and SSE /events on 8080, gRPC on 9090 (Phase 9). The
  # intervals pass through from the shell so tests can shorten them.
  realtime-service:
    build: { context: ./services, args: { SERVICE: realtime-service } }
    environment: [DELAY_MS, FAIL_RATE, WS_PING_INTERVAL, SSE_EVENT_INTERVAL, SSE_HEARTBEAT_INTERVAL]
    restart: "no"
